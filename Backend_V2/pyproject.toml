[project]
name = "leons-backend"
version = "1.0.0"
description = "API de adopción responsable de LeonS Huancayo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "bcrypt>=4.2.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
db = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pyodbc>=5.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

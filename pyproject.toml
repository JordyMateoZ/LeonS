[project]
name = "leons-backend"
version = "1.0.0"
description = "API de adopción responsable de LeonS Huancayo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Backend"]

[tool.hatch.build]
exclude = [
    "Backend/storage",
    "**/__pycache__",
]

[tool.pytest.ini_options]
pythonpath = ["Backend", "."]
testpaths = ["Backend/tests"]
